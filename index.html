<script>
const form=document.getElementById('unlock-form'),input=document.getElementById('birthday'),button=document.getElementById('unlock'),statusText=document.getElementById('status');
const packed=JSON.parse(document.getElementById('gift-data').textContent);
function bytes(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0));}
let attempts=0,blockedUntil=0;
input.addEventListener('input',()=>{input.removeAttribute('aria-invalid');statusText.textContent='';});
form.addEventListener('submit',async event=>{event.preventDefault();try{const Audio=window.AudioContext||window.webkitAudioContext;if(Audio){if(!window.__giftAudioContext||window.__giftAudioContext.state==='closed')window.__giftAudioContext=new Audio();if(window.__giftAudioContext.state==='suspended')void window.__giftAudioContext.resume().catch(()=>{});}}catch{};if(Date.now()<blockedUntil){statusText.textContent='Chờ một chút rồi thử lại em nhé.';return;}if(!window.crypto?.subtle){statusText.textContent='Trình duyệt chưa hỗ trợ mở quà. Em thử dùng Chrome hoặc Safari mới nhé.';return;}
const password=input.value.trim().replace(/[\s/.-]/g,'');if(!/^\d{8}$/.test(password)){statusText.textContent='Em nhập đủ 8 số ngày, tháng và năm sinh nhé.';input.setAttribute('aria-invalid','true');input.focus();return;}
button.disabled=true;statusText.textContent='Đang xoay chiếc chìa khóa…';
try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(packed.salt),iterations:packed.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(packed.iv)},key,bytes(packed.data));const html=new TextDecoder().decode(clear);input.value='';document.getElementById('gate').classList.add('opening');statusText.textContent='Đúng chìa khóa rồi. Mời em vào ♡';await new Promise(resolve=>setTimeout(resolve,window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:700));document.open();document.write(html);document.close();}
catch{attempts++;if(attempts%5===0)blockedUntil=Date.now()+15000;statusText.textContent='Chìa khóa chưa khớp rồi. Em thử lại ngày sinh của mình nhé ♡';input.setAttribute('aria-invalid','true');input.classList.remove('shake');void input.offsetWidth;input.classList.add('shake');input.focus();input.select();button.disabled=false;}
});
</script></body></html>
